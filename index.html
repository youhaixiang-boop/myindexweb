<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通勝月曆 · 吉凶擇日</title>
<style>
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f8f4e9;
    margin: 0;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border: 3px solid #c41e3a;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    padding: 20px;
  }
  .header {
    text-align: center;
    background: linear-gradient(135deg, #c41e3a, #8b0000);
    color: #ffd700;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
    position: relative;
  }
  .header h1 { margin: 0; font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  .controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px 0;
    flex-wrap: wrap;
  }
  select, button {
    padding: 8px 14px;
    font-size: 16px;
    border: 2px solid #c41e3a;
    border-radius: 6px;
    background: #fff;
  }
  button {
    background: #c41e3a;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #a01830; }
  .calendar {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  .calendar th {
    background: #c41e3a;
    color: white;
    padding: 10px;
    font-weight: bold;
  }
  .calendar td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    vertical-align: top;
    height: 120px;
    font-size: 0.85em;
  }
  .day-num {
    font-size: 1.3em;
    font-weight: bold;
  }
  .luck {
    font-size: 1em;
    font-weight: bold;
    margin-top: 1px;
  }
  .luck.ji { color: #c41e3a; }
  .luck.xiong { color: #222; }
  .luck.ping { color: #555; }
  .lunar {
    font-size: 0.7em;
    color: #a00;
    margin-top: 1px;
  }
  .yi-ji {
    font-size: 0.58em;
    color: #666;
    margin-top: 2px;
    line-height: 1.1;
    text-align: left;
    padding: 0 2px;
  }
  .today {
    background: #fff3cd !important;
    border: 2px solid #c41e3a !important;
    box-shadow: inset 0 0 0 1px #c41e3a;
  }
  .today .day-num {
    color: #c41e3a;
    font-weight: bold;
  }
  .info {
    text-align: center;
    margin-top: 15px;
    font-size: 0.9em;
    color: #666;
    background: #fff8e7;
    padding: 10px;
    border-radius: 6px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 10px 0;
    font-weight: bold;
  }
  .legend span.ji { color: #c41e3a; }
  .legend span.xiong { color: #333; }
  .legend span.ping { color: #666; }

  /* 手機兼容 */
  @media (max-width: 768px) {
    body { padding: 8px; }
    .container { padding: 10px; border-width: 2px; border-radius: 8px; }
    .header h1 { font-size: 1.4em; }
    .header div { font-size: 0.75em !important; }
    .controls { gap: 8px; }
    select, button { padding: 6px 10px; font-size: 14px; }
    #calendar-title { font-size: 1.2em !important; }
    .calendar th { padding: 6px 2px; font-size: 0.75em; }
    .calendar td { padding: 4px 2px; height: auto; min-height: 90px; font-size: 0.75em; }
    .day-num { font-size: 1.1em; }
    .luck { font-size: 0.9em; }
    .lunar { font-size: 0.65em; }
    .yi-ji { font-size: 0.5em; line-height: 1.05; }
    .legend { gap: 10px; font-size: 0.8em; flex-wrap: wrap; }
    .info { font-size: 0.75em; padding: 8px; }
  }

  @media (max-width: 480px) {
    .calendar th { font-size: 0.65em; padding: 4px 1px; }
    .calendar td { padding: 3px 1px; min-height: 80px; }
    .yi-ji { font-size: 0.45em; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🐴 馬年通勝月曆 · 吉凶擇日</h1>
    <div style="font-size:0.9em; margin-top:5px;">學習自傳統黃曆與周易擇日原理 · 僅供參考</div>
  </div>

  <div class="controls">
    <label>年份：
      <select id="year"></select>
    </label>
    <label>月份：
      <select id="month">
        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
        <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
      </select>
    </label>
    <button onclick="generateCalendar()">生成月曆</button>
  </div>

  <div class="legend">
    <span class="ji">吉 = 黃道宜事</span>
    <span class="ping">平 = 中性平常</span>
    <span class="xiong">凶 = 黑道慎用</span>
  </div>

  <div id="calendar-title" style="text-align:center; font-size:1.6em; color:#c41e3a; margin:10px 0; font-weight:bold;"></div>
  <table class="calendar" id="cal">
    <thead>
      <tr>
        <th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th><th>星期六</th><th>星期日</th>
      </tr>
    </thead>
    <tbody id="cal-body"></tbody>
  </table>

  <div class="info">
    已增加農曆近似顯示、詳細宜事項與忌事項。<br>
    農曆為簡化近似（僅供參考），吉凶與宜忌基於建除十二神傳統口訣。重要事宜請查正版通勝。
  </div>
</div>

<script>
const stems = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const jianchu = ['建','除','滿','平','定','執','破','危','成','收','開','閉'];

// 更準確日柱（1900-01-01 甲辰 = index 40）
function getDayIndex(year, month, day) {
  const base = new Date(1900, 0, 1);
  const target = new Date(year, month - 1, day);
  const diffDays = Math.round((target - base) / 86400000);
  return (40 + diffDays + 60) % 60;
}

// 近似十二值日（以月份地支起建，簡化版）
function getJianchu(year, month, day) {
  const idx = getDayIndex(year, month, day);
  const branchIdx = idx % 12;
  const monthBranch = (month + 1) % 12;
  const start = monthBranch;
  const offset = (branchIdx - start + 12) % 12;
  return jianchu[offset];
}

// 簡易農曆近似（僅供顯示參考，非精確）
function getApproxLunar(year, month, day) {
  // 粗略偏移：公曆月大致對應農曆，加簡單日數調整
  const lunarMonths = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','臘月'];
  let lm = month - 1;
  let ld = day - 5; // 粗略偏移
  if (ld < 1) { ld += 29; lm = (lm + 11) % 12; }
  if (ld > 30) { ld -= 30; lm = (lm + 1) % 12; }
  return lunarMonths[lm] + (ld < 10 ? '初' + ['','一','二','三','四','五','六','七','八','九'][ld] : (ld === 10 ? '初十' : ld));
}

function getLuckAndYi(year, month, day) {
  const jc = getJianchu(year, month, day);
  const idx = getDayIndex(year, month, day);
  const branchIdx = idx % 12;

  let luck = '平';
  let yi = '';
  let ji = '';

  const yiMap = {
    '建': '出行 豎柱',
    '除': '除舊迎新 祭祀 解除',
    '滿': '祭祀 祈福',
    '平': '修造 安床 掃舍',
    '定': '訂盟 簽約 安床',
    '執': '捕捉 修造 納財',
    '破': '破屋 拆卸',
    '危': '安床 求財 會親友',
    '成': '開業 嫁娶 交易',
    '收': '納財 入庫',
    '開': '開市 出行 嫁娶',
    '閉': '修築 補垣'
  };
  const jiMap = {
    '建': '動土 開倉',
    '除': '嫁娶 求官',
    '滿': '嫁娶 開市',
    '平': '大事 詞訟',
    '定': '出行 動土',
    '執': '嫁娶 開市',
    '破': '嫁娶 開業 入宅',
    '危': '安葬 嫁娶',
    '成': '動土 破土',
    '收': '開市 出行',
    '開': '安葬 動土',
    '閉': '開市 嫁娶 出行'
  };

  const huang = ['除','危','定','執','成','開'];
  const hei = ['建','滿','破','收','閉'];

  if (huang.includes(jc)) {
    luck = '吉';
  } else if (hei.includes(jc) && jc !== '平') {
    luck = (jc === '破' || jc === '閉') ? '凶' : '平';
  } else {
    luck = '平';
  }

  yi = yiMap[jc] || '平常';
  ji = jiMap[jc] || '無大忌';

  return { luck, yi, ji };
}

function generateCalendar() {
  const year = parseInt(document.getElementById('year').value);
  const month = parseInt(document.getElementById('month').value);
  const title = document.getElementById('calendar-title');
  const body = document.getElementById('cal-body');
  body.innerHTML = '';

  const monthNames = ['','壹','貳','叁','肆','伍','陸','柒','捌','玖','拾','拾壹','拾貳'];
  title.textContent = `${monthNames[month]}月 · ${year}年${month}月`;

  const firstDay = new Date(year, month - 1, 1);
  let start = firstDay.getDay();
  start = start === 0 ? 6 : start - 1;

  const daysInMonth = new Date(year, month, 0).getDate();

  let html = '<tr>';
  for (let i = 0; i < start; i++) html += '<td></td>';

  for (let d = 1; d <= daysInMonth; d++) {
    const { luck, yi, ji } = getLuckAndYi(year, month, d);
    const lunar = getApproxLunar(year, month, d);
    const cls = luck === '吉' ? 'ji' : luck === '凶' ? 'xiong' : 'ping';
    const today = new Date();
    const isToday = (year === today.getFullYear() && month === (today.getMonth() + 1) && d === today.getDate());
    const todayClass = isToday ? 'today' : '';
    html += `<td class="${todayClass}">
      <div class="day-num">${d}${isToday ? ' ●' : ''}</div>
      <div class="lunar">${lunar}</div>
      <div class="luck ${cls}">${luck}</div>
      <div class="yi-ji">宜：${yi}<br>忌：${ji}</div>
    </td>`;
    if ((start + d) % 7 === 0) html += '</tr><tr>';
  }
  html += '</tr>';
  body.innerHTML = html;
}

// 初始化年份
const yearSel = document.getElementById('year');
const currentYear = new Date().getFullYear();
for (let y = currentYear - 2; y <= currentYear + 5; y++) {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y + '年';
  if (y === 2026) opt.selected = true;
  yearSel.appendChild(opt);
}
document.getElementById('month').value = 10;
generateCalendar();
</script>
</body>
</html>
